name: Gerar IPA Los Primos Music

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: |
          brew install xcodegen

      - name: Gerar Projeto Xcode (.xcodeproj)
        run: |
          xcodegen generate

      - name: Compilar App para iOS (Release)
        run: |
          xcodebuild archive \
            -project LosPrimosMusic.xcodeproj \
            -scheme LosPrimosMusic \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "build/LosPrimosMusic.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Empacotar no Formato .IPA
        run: |
          mkdir -p Payload
          cp -r "build/LosPrimosMusic.xcarchive/Products/Applications/Los Primos.app" Payload/
          zip -r LosPrimosMusic.ipa Payload/

      - name: Disponibilizar IPA para Download
        uses: actions/upload-artifact@v4
        with:
          name: LosPrimosMusic-iOS-IPA
          path: LosPrimosMusic.ipa
          retention-days: 14
