name: LosPrimosMusic
options:
  bundleIdPrefix: com.losprimos
  deploymentTarget:
    iOS: "16.0"
targets:
  LosPrimosMusic:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: App
      - path: Core
      - path: Models
      - path: DesignSystem
      - path: Views
      - path: Resources
    info:
      path: App/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.losprimos.music
        PRODUCT_NAME: "Los Primos"
        INFOPLIST_FILE: App/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
